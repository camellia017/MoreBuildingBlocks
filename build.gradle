plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"morebuildingblocks" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	// Drives the real client from MBClientGameTest and writes screenshots of every
	// block this mod adds into the run's own screenshots directory. Built on the
	// normal client run so it keeps Loom's launch plumbing, asset index and natives.
	//
	// The run lives in a directory of its own. The framework creates a singleplayer
	// world for every run and never removes it, so the worlds pile up where the run
	// happens: twenty runs left twenty worlds under the shared run/ directory, and a
	// run that starts on a world from a previous one is not the run that was asked
	// for. Keeping them here leaves run/ itself untouched by the tests, and one task
	// (cleanGameTestRun, see the bottom of this file) throws the whole pile away.
	runs {
		clientGameTest {
			client()
			configName = "Minecraft Client Game Test"
			source sourceSets.client
			runDir "run/client-gametest"
			vmArg "-Dfabric.client.gametest"
			vmArg "-Dfabric.client.gametest.modid=morebuildingblocks"
		}
	}
}

fabricApi {
	configureDataGeneration {
		client = true
		modId = "morebuildingblocks"
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

// The client game test creates a world per run and never removes one, so the pile in
// the test's run directory grows for as long as the tests are run. This throws away
// everything a run leaves behind: worlds, screenshots and logs.
tasks.register('cleanGameTestRun', Delete) {
	description = 'Deletes the client game test run directory: worlds, screenshots and logs.'
	group = 'verification'

	delete layout.projectDirectory.dir('run/client-gametest')
}

// The dedicated server the tests start reads its consent from the run directory's own
// eula.txt, and refuses to start without it - which shows up as a timeout in the
// dedicated server check rather than as anything to do with the EULA. A directory that
// has been cleaned does not have the file, so it is written before every run. It says
// the same thing the game writes when a player accepts the EULA:
// https://aka.ms/MinecraftEULA
def gameTestEula = layout.projectDirectory.file('run/client-gametest/eula.txt')

tasks.named('runClientGameTest') {
	doFirst {
		def eula = gameTestEula.asFile

		if (!eula.exists()) {
			eula.parentFile.mkdirs()
			eula.text = '#By changing the setting below to TRUE you are indicating your agreement to our EULA ' +
				'(https://aka.ms/MinecraftEULA).\neula=true\n'
		}
	}
}
